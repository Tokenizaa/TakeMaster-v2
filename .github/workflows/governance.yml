name: Project Governance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  governance-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.14'
    - name: Install dependencies
      run: bun install --frozen-lockfile
    - name: Run governance check
      run: bun run governance:check
    - name: Type check
      run: bun run lint
    # The legacy test files were intentionally removed in Phase 1.
    # Re-enable a test step when the replacement suite is implemented in Phase 2.
    - name: Build and validate Worker bundle
      run: bun run build:worker
